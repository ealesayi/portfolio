<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Simple Lightbox CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.0/simple-lightbox.min.css">
  <!-- AOS (أنيميشن عند التمرير) -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #content { overflow-x: clip; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0f172a;
      color: #fff;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* شريط تبديل اللغة */
    .lang-bar {
      background-color: #1e293b;
      padding: 8px 0;
      text-align: left;
      direction: ltr;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .lang-bar .container {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .lang-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 30px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 13px;
    }

    .lang-btn:hover {
      background: #38bdf8;
    }

    .lang-btn.active {
      background: #fff;
      color: #0ea5e9;
      border: 2px solid #0ea5e9;
    }

    /* الهيدر */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 30px 0 20px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      padding: 12px 25px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
      margin-bottom: 15px;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      box-shadow: 0 8px 15px rgba(14,165,233,0.3);
    }

    .logo-text {
      text-align: right;
    }

    .logo-text h2 {
      margin: 0;
      color: white;
      font-size: 1.5em;
    }

    .logo-text p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9em;
    }

    .header h1 {
      font-size: 2.5em;
      color: #0ea5e9;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .header .tagline {
      font-size: 1.2em;
      color: #cbd5e1;
      max-width: 600px;
      margin: 0 auto 20px;
      padding: 0 10px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .badge {
      background: #0ea5e9;
      color: white;
      padding: 6px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9em;
      box-shadow: 0 4px 8px rgba(14,165,233,0.3);
    }

    /* الأقسام */
    section {
      padding: 40px 0;
      border-bottom: 1px solid #1e293b;
    }

    h2 {
      font-size: 2em;
      color: #0ea5e9;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
      word-break: break-word;
    }

    h2:after {
      content: '';
      display: block;
      width: 70px;
      height: 3px;
      background: #0ea5e9;
      margin: 8px auto 0;
      border-radius: 2px;
    }

    /* بطاقات الميزات */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .feature-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 25px 15px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid #334155;
    }

    .feature-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 25px rgba(14,165,233,0.2);
    }

    .feature-icon {
      font-size: 2.8em;
      color: #0ea5e9;
      margin-bottom: 15px;
    }

    .feature-card h3 {
      font-size: 1.4em;
      margin-bottom: 10px;
      color: #fff;
    }

    .feature-card p {
      color: #94a3b8;
      font-size: 0.95em;
    }

    /* معرض الصور - شبكة متجاوبة */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    .gallery-item {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      animation: fadeInUp 0.6s ease forwards;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .gallery-item:nth-child(odd) { animation-delay: 0.1s; }
    .gallery-item:nth-child(even) { animation-delay: 0.2s; }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .gallery-item:hover {
      transform: scale(1.02) translateY(-5px);
      box-shadow: 0 15px 30px rgba(14,165,233,0.4);
      border-color: #0ea5e9;
    }

    .gallery-item a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .gallery-item img {
      width: 100%;
      height: 200px; /* مناسبة للصور الطولية */
      object-fit: cover;
      display: block;
      border-bottom: 2px solid #0ea5e9;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .gallery-item p {
      padding: 8px;
      text-align: center;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85em;
      background: rgba(0,0,0,0.2);
    }

    /* قائمة النقاط */
    .list-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 25px;
    }

    .list-item {
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid #0ea5e9;
      font-size: 1em;
      transition: 0.3s;
    }

    .list-item:hover {
      background: #2d3a4f;
      transform: translateX(-5px);
    }

    .list-item i {
      color: #0ea5e9;
      margin-left: 8px;
    }

    /* التقنيات */
    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .tech-item {
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 40px;
      border: 1px solid #0ea5e9;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95em;
    }

    .tech-item i {
      color: #0ea5e9;
      font-size: 1.3em;
    }

    /* فوتر */
    .footer {
      background: #0f172a;
      padding: 30px 0 20px;
      text-align: center;
    }

    .footer .logo {
      margin-bottom: 15px;
      display: inline-flex;
    }

    .contact-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 15px 0;
      color: #94a3b8;
      font-size: 0.9em;
    }

    .contact-info span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .contact-info i {
      color: #0ea5e9;
      font-size: 1.1em;
    }

    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: white;
      padding: 12px 40px;
      border-radius: 50px;
      font-size: 1.2em;
      font-weight: 700;
      text-decoration: none;
      margin: 15px 0;
      box-shadow: 0 8px 18px rgba(14,165,233,0.3);
      transition: 0.3s;
    }

    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(14,165,233,0.5);
    }

    .copyright {
      color: #475569;
      margin-top: 20px;
      font-size: 0.85em;
    }

    /* RTL adjustments */
    [dir="rtl"] .list-item {
      border-left: none;
      border-right: 4px solid #0ea5e9;
    }

    [dir="rtl"] .list-item:hover {
      transform: translateX(5px);
    }

    [dir="rtl"] .tech-item i {
      margin-left: 5px;
      margin-right: 0;
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 2em; }
      h2 { font-size: 1.7em; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .gallery-item img { height: 170px; }
      .badge { padding: 5px 15px; font-size: 0.8em; }
      .feature-card { padding: 20px 10px; }
    }
  </style>
</head>

    let galleryLightbox = null;

    function renderContent(lang) {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('btn-ar').setAttribute('aria-pressed', String(lang === 'ar'));
      document.getElementById('btn-en').setAttribute('aria-pressed', String(lang === 'en'));

      document.title = t.appName;
      if (galleryLightbox) galleryLightbox.destroy();
      const contentDiv = document.getElementById('content');
      contentDiv.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

        const title = lang === 'ar' ? img.arTitle : img.enTitle;

          <div class="gallery-item" data-aos="fade-up" data-aos-delay="${index * 30}" data-aos-duration="500">
            <a href="${img.src}" class="lightbox">
              <img src="${img.src}" alt="${title}" loading="lazy">
            </a>
            <p>${title}</p>
          </div>
        `;

          <div class="container">
            <h2 data-aos="fade-down">📊 ${lang === 'ar' ? 'إحصائيات حية' : 'Live Statistics'}</h2>
            <div class="features-grid" style="grid-template-columns: repeat(4,1fr);">
              ${t.stats.map((stat, idx) => `<div class="feature-card" style="padding: 15px;" data-aos="flip-left" data-aos-delay="${idx * 50}">${stat}</div>`).join('')}
            </div>
          </div>
        </section>

        <!-- التقنيات -->
        <section>
          <div class="container">
            <h2 data-aos="fade-down">${t.techTitle}</h2>
            <div class="tech-grid">
              ${t.tech.map((tech, idx) => `
                <div class="tech-item" data-aos="zoom-in" data-aos-delay="${idx * 50}">
                  <i class="${tech.icon}"></i> ${tech.name}
                </div>
              `).join('')}
            </div>
          </div>
        </section>

        <!-- الفوائد -->
        <section>
          <div class="container">
            <h2 data-aos="fade-down">${t.benefitsTitle}</h2>
            <div class="list-items">
              ${t.benefits.map((item, idx) => `<div class="list-item" data-aos="fade-up" data-aos-delay="${idx * 20}"><i class="fas fa-star"></i> ${item}</div>`).join('')}
            </div>
          </div>
        </section>

        <!-- الخطط المستقبلية -->
        <section>
          <div class="container">
            <h2 data-aos="fade-down">${t.futureTitle}</h2>
            <div class="list-items">
              ${t.future.map((item, idx) => `<div class="list-item" data-aos="fade-up" data-aos-delay="${idx * 20}"><i class="fas fa-rocket"></i> ${item}</div>`).join('')}
            </div>
          </div>
        </section>

        <!-- الفوتر -->
        <footer class="footer">
          <div class="container">
            <div class="logo">
         
                <p>${t.appName}</p>
              </div>
            </div>
            <div class="contact-info">
              <span><i class="fas fa-envelope"></i> ${t.contact.email}</span>
              <span><i class="fas fa-globe"></i> ${t.contact.website}</span>
              <span><i class="fas fa-phone"></i> ${t.contact.phone}</span>
            </div>
            <span class="download-btn">${t.downloadText}</span>
            <div style="margin: 15px 0;">
              <span class="badge" style="background: #1e293b; color: #0ea5e9;">${t.footerBadge}</span>
            </div>
            <p class="copyright">${t.copyright}</p>
          </div>
        </footer>
      `;

      // تفعيل Lightbox
      galleryLightbox = new SimpleLightbox('.gallery-item a', {
        captions: true,
        captionSelector: 'img',
        captionsData: 'alt',
        captionPosition: 'bottom',
        close: true,
        enableKeyboard: true,
        showCounter: true,
      });

      // تفعيل AOS للأنيميشن
      AOS.init({
        duration: 600,
        once: true,
        easing: 'ease-out',
      });
    }

    // أحداث أزرار اللغة
    document.getElementById('btn-ar').addEventListener('click', () => {
      document.getElementById('btn-ar').classList.add('active');
      document.getElementById('btn-en').classList.remove('active');
      currentLang = 'ar';
      renderContent('ar');
      AOS.refresh(); // تحديث AOS بعد تغيير المحتوى
    });

    document.getElementById('btn-en').addEventListener('click', () => {
      document.getElementById('btn-en').classList.add('active');
      document.getElementById('btn-ar').classList.remove('active');
      currentLang = 'en';
      renderContent('en');
      AOS.refresh();
    });

    // التحميل الأولي
    renderContent('ar');
  </script>
</body>
</html>
