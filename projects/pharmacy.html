<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0b1120 0%, #1a2639 100%);
      color: #e2e8f0;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 30px;
    }

    /* شريط تبديل اللغة */
    .lang-bar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(14, 165, 233, 0.2);
    }

    .lang-bar .container {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
    }

    .lang-btn {
      background: transparent;
      color: #94a3b8;
      border: 2px solid #334155;
      padding: 8px 25px;
      border-radius: 40px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .lang-btn:hover {
      background: #0ea5e9;
      color: white;
      border-color: #0ea5e9;
      transform: translateY(-2px);
    }

    .lang-btn.active {
      background: #0ea5e9;
      color: white;
      border-color: #0ea5e9;
      box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.3);
    }

    /* الهيدر */
    .header {
      min-height: 90vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 80%;
      height: 200%;
      background: radial-gradient(circle at 70% 30%, rgba(14, 165, 233, 0.15), transparent 70%);
      z-index: 0;
    }

    .header-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.03);
      padding: 20px 40px;
      border-radius: 80px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(14, 165, 233, 0.3);
      margin-bottom: 30px;
      box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.5);
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      box-shadow: 0 20px 30px -5px rgba(14, 165, 233, 0.5);
    }

    .logo-text {
      text-align: right;
    }

    .logo-text h2 {
      margin: 0;
      color: white;
      font-size: 2.2em;
      font-weight: 800;
    }

    .logo-text p {
      margin: 0;
      color: #94a3b8;
      font-size: 1.1em;
    }

    .header h1 {
      font-size: 4.5em;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      font-weight: 800;
      text-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .header .tagline {
      font-size: 1.5em;
      color: #cbd5e1;
      max-width: 800px;
      margin: 0 auto 30px;
      line-height: 1.8;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .badge {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #0ea5e9;
      padding: 12px 35px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1em;
      border: 1px solid #0ea5e9;
      box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.2);
      transition: all 0.3s;
    }

    .badge:hover {
      transform: translateY(-5px);
      background: #0ea5e9;
      color: white;
      border-color: white;
    }

    /* الأقسام العامة */
    section {
      padding: 100px 0;
      position: relative;
    }

    section:nth-child(even) {
      background: rgba(15, 23, 42, 0.5);
    }

    h2 {
      font-size: 3em;
      color: white;
      margin-bottom: 60px;
      text-align: center;
      position: relative;
      font-weight: 800;
    }

    h2:after {
      content: '';
      display: block;
      width: 120px;
      height: 5px;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      margin: 20px auto 0;
      border-radius: 5px;
    }

    /* بطاقات الميزات */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      margin-top: 50px;
    }

    .feature-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 40px 30px;
      text-align: center;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(14, 165, 233, 0.2);
      box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      transform: scaleX(0);
      transition: transform 0.5s;
    }

    .feature-card:hover {
      transform: translateY(-20px) scale(1.02);
      border-color: #0ea5e9;
      box-shadow: 0 40px 60px -20px rgba(14, 165, 233, 0.5);
    }

    .feature-card:hover::before {
      transform: scaleX(1);
    }

    .feature-icon {
      font-size: 4.5em;
      color: #0ea5e9;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 15px rgba(14, 165, 233, 0.3));
    }

    .feature-card h3 {
      font-size: 2em;
      margin-bottom: 20px;
      color: #fff;
      font-weight: 700;
    }

    .feature-card p {
      color: #94a3b8;
      font-size: 1.1em;
      line-height: 1.8;
    }

    /* قائمة النقاط */
    .list-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-top: 50px;
    }

    .list-item {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(5px);
      padding: 20px 25px;
      border-radius: 20px;
      border-right: 6px solid #0ea5e9;
      font-size: 1.15em;
      transition: all 0.3s;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
    }

    .list-item:hover {
      transform: translateX(10px);
      background: #1e293b;
    }

    .list-item i {
      color: #0ea5e9;
      margin-left: 15px;
      font-size: 1.3em;
    }

    /* التقنيات */
    .tech-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 50px;
    }

    .tech-item {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 20px 50px;
      border-radius: 60px;
      border: 2px solid #0ea5e9;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1.3em;
      transition: all 0.4s;
      box-shadow: 0 15px 25px -10px rgba(14, 165, 233, 0.3);
    }

    .tech-item:hover {
      transform: scale(1.1) rotate(2deg);
      background: #0ea5e9;
      color: white;
      border-color: white;
    }

    .tech-item i {
      font-size: 1.8em;
    }

    /* فوتر */
    .footer {
      background: #0b1120;
      padding: 60px 0 30px;
      text-align: center;
      border-top: 1px solid #1e293b;
    }

    .footer .logo {
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.02);
    }

    .contact-info {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin: 30px 0;
      color: #94a3b8;
      font-size: 1.1em;
    }

    .contact-info i {
      color: #0ea5e9;
      margin-left: 10px;
      font-size: 1.3em;
    }

    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: white;
      padding: 18px 70px;
      border-radius: 60px;
      font-size: 1.5em;
      font-weight: 800;
      text-decoration: none;
      margin: 30px 0;
      box-shadow: 0 20px 40px -5px rgba(14, 165, 233, 0.5);
      transition: all 0.4s;
      border: 2px solid transparent;
    }

    .download-btn:hover {
      transform: scale(1.05) translateY(-5px);
      box-shadow: 0 30px 50px -5px #0ea5e9;
      background: white;
      color: #0ea5e9;
      border-color: #0ea5e9;
    }

    .copyright {
      color: #334155;
      margin-top: 40px;
      font-size: 0.95em;
    }

    /* تخصيص الاتجاه */
    [dir="rtl"] .list-item {
      border-right: 6px solid #0ea5e9;
      border-left: none;
    }

    [dir="rtl"] .list-item:hover {
      transform: translateX(-10px);
    }

    [dir="rtl"] .tech-item i {
      margin-left: 10px;
      margin-right: 0;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2.5em; }
      h2 { font-size: 2.2em; }
    }
  </style>
</head>

            <h2 data-aos="fade-up">${t.benefitsTitle}</h2>
            <div class="list-items">
              ${t.benefits.map((item, index) => `<div class="list-item" data-aos="fade-right" data-aos-delay="${index * 50}"><i class="fas fa-star"></i> ${item}</div>`).join('')}
            </div>
          </div>
        </section>

        <!-- الخطط المستقبلية -->
        <section>
          <div class="container">
            <h2 data-aos="fade-up">${t.futureTitle}</h2>
            <div class="list-items">
              ${t.future.map((item, index) => `<div class="list-item" data-aos="fade-right" data-aos-delay="${index * 50}"><i class="fas fa-rocket"></i> ${item}</div>`).join('')}
            </div>
          </div>
        </section>

        <!-- الفوتر -->
        <footer class="footer">
          <div class="container">
            <div class="logo" data-aos="fade-up">
              <div class="logo-icon">💊</div>
              <div class="logo-text">
                <h2>${t.designer}</h2>
                <p>${t.appName}</p>
              </div>
            </div>
            <div class="contact-info" data-aos="fade-up" data-aos-delay="100">
              <span><i class="fas fa-envelope"></i> ${t.contact.email}</span>
              <span><i class="fas fa-globe"></i> ${t.contact.website}</span>
              <span><i class="fas fa-phone"></i> ${t.contact.phone}</span>
            </div>
            <a href="../assets/docs/pharmacy-system.pdf" class="download-btn" data-aos="zoom-in">${t.downloadText}</a>
            <div style="margin: 20px 0;">
              <span class="badge" style="background: #1e293b; color: #0ea5e9;">${t.footerBadge}</span>
            </div>
            <p class="copyright">${t.copyright}</p>
          </div>
        </footer>
      `;

      // تحديث AOS
      AOS.init({
        duration: 1000,
        once: true,
        offset: 100
      });
    }

    // أحداث أزرار اللغة
    document.getElementById('btn-ar').addEventListener('click', () => {
      document.getElementById('btn-ar').classList.add('active');
      document.getElementById('btn-en').classList.remove('active');
      currentLang = 'ar';
      renderContent('ar');
    });

    document.getElementById('btn-en').addEventListener('click', () => {
      document.getElementById('btn-en').classList.add('active');
      document.getElementById('btn-ar').classList.remove('active');
      currentLang = 'en';
      renderContent('en');
    });

    // التحميل الأولي
    renderContent('ar');
  </script>
</body>
</html>
